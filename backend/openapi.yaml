openapi: 3.1.0
info:
  title: Hand2Hand API
  version: "1.0.0"
  description: >
    Контракт REST API Hand2Hand. Источник истины — фронт:
    поля в `Front-AdminPanel/src/core/api/types.ts`, поведение — в `src/core/api/mock.ts`.
    Этот файл описывает каждый эндпоинт из таблицы README фронта.

    Соглашения: деньги — целые копейки (integer, int64); даты — ISO 8601 со
    смещением; авторизация — `Authorization: Bearer <access JWT>`, JWT выпускает
    сервис identity (раздел auth); ошибки — `{code, message}`, где `message`
    показывается пользователю как есть (по-русски, для человека). У identity
    ошибки в формате ProblemDetail: текст в `detail`.

servers:
  - url: /api/v1

tags:
  - name: auth
    description: Вход по одноразовому коду, токены
  - name: catalog
    description: Концерты, билеты, избранное
  - name: orders
    description: Заказы, оплата
  - name: disputes
    description: Споры по заказам
  - name: sell
    description: Заявки продавцов
  - name: account
    description: Личный кабинет
  - name: admin
    description: Админка (роль admin)
  - name: webhooks
    description: Входящие уведомления платёжного сервиса

security:
  - bearerAuth: []

paths:
  # ---------------- auth: сервис identity ----------------
  # Отдельный сервис (репозиторий h2h/identity, порт 8081). Пути у него без /api/v1:
  # nginx и dev-прокси переписывают /api/v1/auth/* → /auth/*, /api/v1/me → /me.
  # Ошибки — ProblemDetail (RFC 9457): {type, title, status, detail, code[, errors]}.
  /auth/otp/request:
    post:
      tags: [auth]
      summary: Отправить код на email
      description: >
        Шлёт 6-значный код, живёт 10 минут. Повтор — не раньше resendAvailableAt
        (60 с), не больше 5 запросов в час на email; иначе 429 с Retry-After.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 320 }
      responses:
        "202":
          description: Код отправлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpChallenge" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503":
          description: "mail_unavailable — письмо не ушло"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Проверить код и получить токены
      description: >
        Если пользователя ещё не было — создаётся с ролью CUSTOMER.
        До 5 неверных попыток на один challengeId (too_many_attempts), дальше — новый код.
        ⚠️ Сейчас refreshToken приходит в теле. Целевая схема — httpOnly-кука
        `refresh_token; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth`, без поля в теле;
        фронт готов к обоим вариантам.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: "^\\d{6}$", example: "123456" }
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          description: "invalid_code, too_many_attempts, validation_failed"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "user_blocked"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Обменять refresh на новую пару токенов
      description: >
        Ротация: старый refresh сразу недействителен. Повторное использование
        старого гасит всю цепочку сессии (reuse detection, окно 10 с).
        Сейчас токен передаётся в теле; после перехода на куку тело будет пустым.
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshBody" }
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401":
          description: "invalid_refresh_token — войти заново"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Выйти — отозвать текущую сессию
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshBody" }
      responses:
        "204": { description: Сессия отозвана }

  /me:
    get:
      tags: [auth]
      summary: Мой профиль
      description: >
        Фронт сводит роли к своей: roles содержит ADMIN → role "admin", иначе "customer".
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/sessions:
    delete:
      tags: [auth]
      summary: Выйти на всех устройствах
      responses:
        "204": { description: Все сессии отозваны }
        "401": { $ref: "#/components/responses/Problem" }

  # ---------------- catalog ----------------
  /events:
    get:
      tags: [catalog]
      summary: Список концертов (витрина или поиск продавца)
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Поиск по названию, артисту, площадке, городу" }
        - { name: city, in: query, schema: { type: string } }
        - { name: group, in: query, schema: { $ref: "#/components/schemas/EventGroup" } }
        - name: scope
          in: query
          schema: { type: string, enum: [catalog, sell], default: catalog }
          description: >
            catalog — витрина: только предстоящие; концерты без организатора —
            лишь пока есть билеты. sell — все предстоящие, для формы продавца.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EventItem" } }

  /events/cities:
    get:
      tags: [catalog]
      summary: Города, где есть концерты
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: string } }

  /events/{id}:
    get:
      tags: [catalog]
      summary: Один концерт
      security: []
      parameters: [ { $ref: "#/components/parameters/EventId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventItem" }
        "404": { $ref: "#/components/responses/Error" }

  /events/{id}/offers:
    get:
      tags: [catalog]
      summary: Билеты концерта в продаже
      description: Только свободные, отсортированы по цене по возрастанию.
      security: []
      parameters: [ { $ref: "#/components/parameters/EventId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Offer" } }

  /events/{id}/waitlist:
    post:
      tags: [catalog]
      summary: Встать в лист ожидания
      parameters: [ { $ref: "#/components/parameters/EventId" } ]
      responses:
        "200":
          description: OK (повторный вызов возвращает ту же запись)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "401": { $ref: "#/components/responses/Error" }

  /events/{id}/favorite:
    put:
      tags: [catalog]
      summary: Добавить в избранное
      parameters: [ { $ref: "#/components/parameters/EventId" } ]
      responses:
        "204": { description: Добавлено (идемпотентно) }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [catalog]
      summary: Убрать из избранного
      parameters: [ { $ref: "#/components/parameters/EventId" } ]
      responses:
        "204": { description: Убрано (идемпотентно) }
        "401": { $ref: "#/components/responses/Error" }

  # ---------------- orders ----------------
  /orders:
    post:
      tags: [orders]
      summary: Забронировать билет
      description: >
        Бронирует предложение на 15 минут. Проверяет доступность продаж:
        если билетная система организатора не отвечает — 503 AGGREGATOR_UNAVAILABLE.
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offerId]
              properties:
                offerId: { type: string }
      responses:
        "200":
          description: Создан заказ в статусе RESERVED с expiresAt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: Место уже занято
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example: { code: SEAT_TAKEN, message: "Этот билет только что забрали. Выберите другой." }
        "503":
          description: Продажи приостановлены
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example: { code: AGGREGATOR_UNAVAILABLE, message: "Билетная система организатора сейчас не отвечает…" }

  /orders/{id}/pay:
    post:
      tags: [orders]
      summary: Оплатить заказ
      description: >
        Создаёт платёж у провайдера (двухстадийный: деньги замораживаются).
        Возвращает заказ и paymentUrl платёжной страницы; paymentUrl может быть
        null, если провайдер его не требует.
      parameters:
        - { $ref: "#/components/parameters/OrderId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyer]
              properties:
                buyer: { $ref: "#/components/schemas/Buyer" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [order, paymentUrl]
                properties:
                  order: { $ref: "#/components/schemas/Order" }
                  paymentUrl: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: Бронь истекла
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example: { code: RESERVATION_EXPIRED, message: "Время брони вышло, билет вернулся в продажу." }

  /orders/{id}:
    get:
      tags: [orders]
      summary: Заказ по id
      description: Фронт опрашивает раз в 2 секунды, пока статус не станет финальным.
      parameters: [ { $ref: "#/components/parameters/OrderId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------- disputes ----------------
  /orders/{id}/dispute:
    get:
      tags: [disputes]
      summary: Спор по заказу
      parameters: [ { $ref: "#/components/parameters/OrderId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeView" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [disputes]
      summary: Открыть спор
      description: >
        Только по заказу в статусе ISSUED и до disputeUntil. До 5 файлов
        (image/pdf/video) по 20 МБ каждый. Первое сообщение — текст от покупателя.
      parameters: [ { $ref: "#/components/parameters/OrderId" } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/DisputeMessageForm" }
      responses:
        "200":
          description: Спор открыт
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeView" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413":
          description: Файлы слишком большие
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example: { code: TOO_LARGE, message: "Файлы слишком большие — уменьшите их или загрузите по одному." }

  /orders/{id}/dispute/messages:
    post:
      tags: [disputes]
      summary: Добавить сообщение в спор
      parameters: [ { $ref: "#/components/parameters/OrderId" } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/DisputeMessageForm" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeView" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  # ---------------- sell ----------------
  /sell-requests:
    post:
      tags: [sell]
      summary: Выставить билет на продажу
      description: |
        multipart: поле data — JSON SellRequestInput (без файла), ticketFile —
        файл билета (обязателен для концертов без организатора).

        **Защита модерации от мусора** (правила те же, что во фронте —
        `src/shared/lib/sourceCheck.ts`; фронт можно обойти, поэтому бэкенд обязан проверять сам):

        Для любой заявки:
        - orderNumber — не короче 4 символов, есть цифры, не одинаковые символы, не «1234/12345/0000» → 400 INVALID;
        - ticketFile — только PDF или изображение. **QR-код в файле обязателен**: PDF рендерить
          постранично (первые 3 страницы, несколько масштабов), картинку — как есть, искать QR (ZXing).
          Не открылся (битый, с паролем) → 400 INVALID_FILE; QR не найден → 400 NO_QR.
        - SHA-256 файла совпал с файлом другой живой заявки (не cancelled; своя rejected — можно)
          → 409 DUPLICATE_TICKET; SHA-256 содержимого QR совпал с QR другой живой заявки → тоже
          409 DUPLICATE_TICKET (тот же билет, пересохранённый в другой файл).

        Только для newEvent:
        - sourceUrl: http(s), домен, не IP; не главная страница сайта; стоп-лист — видео,
          соцсети, поиск, сокращатели (YouTube, Rutube, TikTok, VK-видео, Telegram, Google/Яндекс-поиск,
          Википедия, clck.ru, bit.ly и т. п.); ВКонтакте — только страница мероприятия или сообщества
          → 400 INVALID_SOURCE с понятной причиной;
        - у продавца 3+ страйков (отказов со spam=true) — новые концерты закрыты на 30 дней с последнего
          страйка → 403 SELLER_RESTRICTED (каталожные концерты продавать можно);
        - не больше 2 заявок с новым концертом в статусе review одновременно и 5 за сутки → 429 TOO_MANY_PENDING;
        - (рекомендуется) аккаунт младше суток — новые концерты недоступны.

        **Концерта нет в каталоге (newEvent).** Продавец концерт НЕ создаёт. Бэкенд ищет совпадение
        (город, день начала, нормализованное название — регистр, ё/е, кавычки и знаки не важны):
        с концертом каталога → 409 EVENT_EXISTS или RESALE_FORBIDDEN; с открытой EventRequest →
        билет присоединяется к ней (sourceUrl добавляется в sourceUrls), иначе создаётся новая
        EventRequest. Билет получает status=event_review, guarantee=escrow, а event — временную
        ссылку на заявку (id заявки). Решение по заявке — /admin/event-requests.

        После создания бэкенд асинхронно считает SellCheck (см. AdminSellRequest.check):
        - известный билетный сервис по домену ссылки — плюс;
        - загрузить страницу по ссылке (защита от SSRF: только публичные IP после резолва,
          без редиректов во внутреннюю сеть, таймаут 5 с, до 2 МБ) и искать на ней название,
          город, дату — совпадения плюсом;
        - QR/штрихкод в файле найден — плюс, не найден — минус;
        - PDF лучше фото; история продавца: одобренные — плюс, страйки — минус.
        Ниже 40 — suspicious: такие заявки модератор видит отдельным списком.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/SellRequestInput"
                ticketFile:
                  type: string
                  format: binary
                receiptFile:
                  type: string
                  format: binary
                  description: >
                    Необязательно: чек, подтверждение оплаты или скриншот письма из кассы.
                    Повышает оценку заявки (+10) и видно модератору. QR в нём не требуется.
      responses:
        "200":
          description: Заявка создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellRequest" }
        "400":
          description: >
            INVALID; INVALID_SOURCE (ссылка не на страницу концерта); NO_QR (в файле нет читаемого QR);
            INVALID_FILE (файл не открывается)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: SELLER_RESTRICTED — страйки, новые концерты временно закрыты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            DUPLICATE_TICKET — этот файл или штрихкод уже в другой заявке;
            EVENT_EXISTS — newEvent совпал с концертом каталога (город, день, похожее название) — выбрать его;
            RESALE_FORBIDDEN — у концерта запрет перепродажи (и для eventId, и для совпавшего newEvent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: TOO_MANY_PENDING — лимит заявок с новыми концертами
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /sell-requests/{id}/cancel:
    post:
      tags: [sell]
      summary: Снять объявление с продажи
      description: >
        Только своё и только пока билет не куплен (статусы review, pending, listed).
        Предложение убирается из витрины, заявка получает статус cancelled, выплата — cancelled.
        Если билет сейчас забронирован покупателем (заказ RESERVED или PAID), снимать нельзя —
        409 RESERVED; после истечения брони можно повторить. Повторный вызов на уже снятой
        заявке — 409 INVALID. Действие пишется в аудит (sell:cancel).
      parameters:
        - $ref: "#/components/parameters/SellRequestId"
      responses:
        "200":
          description: Снято
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellRequest" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            ALREADY_SOLD — билет уже купили; RESERVED — билет сейчас оплачивают;
            INVALID — заявка уже закрыта (rejected или cancelled).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ---------------- account ----------------
  /users/me/orders:
    get:
      tags: [account]
      summary: Мои заказы
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Order" } }
        "401": { $ref: "#/components/responses/Error" }

  /users/me/sell-requests:
    get:
      tags: [account]
      summary: Мои продажи
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SellRequest" } }
        "401": { $ref: "#/components/responses/Error" }

  /users/me/payout-method:
    get:
      tags: [account]
      summary: Мои реквизиты выплаты
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutMethodInfo" }
        "204": { description: Реквизиты ещё не указаны }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [account]
      summary: Сохранить или заменить реквизиты выплаты
      description: |
        Полные реквизиты не возвращаются никогда — только маска в details. Карта: номер вводится
        в форме платёжного сервиса, сюда приходит токен. Выплаты в статусе no_details после сохранения
        уходят по этим реквизитам. Аудит: payout:set.

        **Менять реквизиты нельзя, пока есть выплата в статусе scheduled** → 409 PAYOUT_IN_PROGRESS.
        Защита от угона аккаунта: иначе чужой человек подменит реквизиты между продажей и переводом.
        Как у TicketSwap: после продажи реквизиты закрыты; если банк вернул платёж, выплату повторяют
        после того, как продавец их обновит (это делает поддержка).

        ⚠️ Способы выплаты согласовать с платёжным сервисом **до разработки**: у ЮKassa «Безопасная
        сделка» в документации — выплаты на банковскую карту и кошелёк ЮMoney; про СБП и перевод на
        счёт по реквизитам там не сказано. Фронт даёт выбрать все три, карта первая и по умолчанию.
        Если провайдер не умеет СБП или счёт — закрыть их на бэкенде (400 с понятным текстом),
        фронт подстроится.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutInput" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutMethodInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: PAYOUT_IN_PROGRESS — есть выплата в статусе scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /users/me/waitlist:
    get:
      tags: [account]
      summary: Мои листы ожидания
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WaitlistEntry" } }
        "401": { $ref: "#/components/responses/Error" }

  /users/me/favorites:
    get:
      tags: [account]
      summary: Избранные концерты
      description: Только предстоящие.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EventItem" } }
        "401": { $ref: "#/components/responses/Error" }

  /users/me/notifications:
    get:
      tags: [account]
      summary: Лента уведомлений
      description: >
        События по покупкам, продажам, выплатам и спорам текущего пользователя, новые сверху,
        не больше 50. Бэкенд пишет их в таблицу событий в момент перехода статуса
        (оплата, перевыпуск, FAILED/EXPIRED, выставлено/отклонено/снято/продано, выплата,
        спор открыт/сообщение/решение). Те же события уходят письмом. title и text — готовый
        текст по-русски; фронт по kind выбирает только иконку. read = at не позже отметки
        «прочитано» пользователя.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationFeed" }
        "401": { $ref: "#/components/responses/Error" }

  /users/me/notifications/read:
    post:
      tags: [account]
      summary: Отметить все уведомления прочитанными
      description: Ставит отметку «прочитано» на текущий момент. Идемпотентно.
      responses:
        "204": { description: Готово }
        "401": { $ref: "#/components/responses/Error" }

  # ---------------- admin ----------------
  /admin/aggregators:
    get:
      tags: [admin]
      summary: Билетные системы организаторов
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Aggregator" } }
        "403": { $ref: "#/components/responses/Error" }

  /admin/aggregators/{id}:
    patch:
      tags: [admin]
      summary: Сменить режим продаж
      description: Пишется в журнал действий с автором и причиной.
      parameters: [ { $ref: "#/components/parameters/AggregatorId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, reason]
              properties:
                mode: { $ref: "#/components/schemas/AggregatorMode" }
                reason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Aggregator" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/aggregators/{id}/check:
    post:
      tags: [admin]
      summary: Проверить доступность сейчас
      parameters: [ { $ref: "#/components/parameters/AggregatorId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Aggregator" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/orders:
    get:
      tags: [admin]
      summary: Все заказы
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Order" } }
        "403": { $ref: "#/components/responses/Error" }

  /admin/sell-requests:
    get:
      tags: [admin]
      summary: Все заявки продавцов (с данными для модерации)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminSellRequest" } }
        "403": { $ref: "#/components/responses/Error" }

  /admin/sell-requests/{id}/review:
    post:
      tags: [admin]
      summary: Решение по заявке продавца
      description: >
        approve=true — публикует концерт и билет; иначе отклоняет (comment обязателен).
        spam=true (только с approve=false) — отказ как мусор: продавцу страйк, comment можно
        не писать — подставляется стандартный текст. В аудит пишется sell:spam.
      parameters: [ { $ref: "#/components/parameters/SellRequestId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve, comment]
              properties:
                approve: { type: boolean }
                comment: { type: string }
                spam: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSellRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/event-requests:
    get:
      tags: [admin]
      summary: Заявки на добавление концертов
      description: >
        Сначала pending по убыванию check.score, затем рассмотренные (новые сверху).
        sellers у pending — только билеты в event_review (снятые продавцами не считаются);
        если все продавцы сняли билеты, заявка удаляется.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EventRequest" } }
        "403": { $ref: "#/components/responses/Error" }

  /admin/event-requests/{id}/add:
    post:
      tags: [admin]
      summary: Добавить концерт в каталог
      description: >
        Модератор проверил: концерт существует, проходит в нашем регионе, организатор не запрещает
        перепродажу, дата не прошла (во фронте — обязательный чек-лист). Создаётся опубликованный
        концерт без организатора; все билеты заявки в event_review → review, получают event этого
        концерта и уведомление sell_event_added. Аудит: event:add.
      parameters: [ { $ref: "#/components/parameters/SellRequestId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCardInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/event-requests/{id}/merge:
    post:
      tags: [admin]
      summary: Концерт уже есть — привязать билеты к нему
      description: >
        Билеты заявки получают event указанного концерта: без организатора → review, с организатором → pending.
        Нельзя привязать к концерту с resaleForbidden (400). Аудит: event:merge.
      parameters: [ { $ref: "#/components/parameters/SellRequestId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/event-requests/{id}/reject:
    post:
      tags: [admin]
      summary: Отклонить заявку на концерт
      description: >
        Все билеты заявки → rejected с текстом причины (+ comment). reason=resale_forbidden — дополнительно
        создаётся опубликованный концерт с resaleForbidden=true и resaleNote=comment: следующие продавцы
        получат RESALE_FORBIDDEN сразу. reason=spam — каждому продавцу страйк. reason=other — comment обязателен.
        Аудит: event:reject:<reason>.
      parameters: [ { $ref: "#/components/parameters/SellRequestId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, comment]
              properties:
                reason: { $ref: "#/components/schemas/EventRejectReason" }
                comment: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/disputes:
    get:
      tags: [admin]
      summary: Все споры (открытые сверху)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminDispute" } }
        "403": { $ref: "#/components/responses/Error" }

  /admin/disputes/{id}/resolve:
    post:
      tags: [admin]
      summary: Решить спор
      description: >
        refund=true — заказ REFUNDED, выплата отменена; иначе спор отклонён,
        выплата продавцу по графику. comment видят обе стороны.
      parameters: [ { $ref: "#/components/parameters/OrderId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refund, comment]
              properties:
                refund: { type: boolean }
                comment: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeView" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  # ---------------- webhooks ----------------
  /webhooks/yookassa:
    post:
      tags: [webhooks]
      summary: Уведомление платёжного сервиса
      description: >
        Без JWT. Защита: проверка IP отправителя + перепроверка статуса платежа
        запросом к провайдеру (телу уведомления не доверяем). Обрабатывается
        идемпотентно по (тип события + id платежа). Всегда отвечаем 200 быстро.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, example: payment.waiting_for_capture }
                object:
                  type: object
                  properties:
                    id: { type: string }
      responses:
        "200": { description: Принято }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EventId:
      { name: id, in: path, required: true, schema: { type: string } }
    OrderId:
      { name: id, in: path, required: true, schema: { type: string } }
    AggregatorId:
      { name: id, in: path, required: true, schema: { type: string } }
    SellRequestId:
      { name: id, in: path, required: true, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Повтор с тем же ключом возвращает первый результат, а не создаёт новую сущность.

  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Problem:
      description: Ошибка identity
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Money:
      type: integer
      format: int64
      description: Деньги в копейках.

    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: SEAT_TAKEN }
        message:
          type: string
          description: Показывается пользователю как есть. По-русски, для человека.

    EventGroup:
      type: string
      enum: [concerts, festivals, theatre, standup, classic, kids, sport, club]
    EventStatus:
      type: string
      enum: [scheduled, postponed, cancelled, sold_out]
    OrderStatus:
      type: string
      enum: [CREATED, RESERVED, PAID, ISSUED, EXPIRED, FAILED, REFUNDED]
    Guarantee:
      type: string
      enum: [organizer, escrow]
      description: organizer — перевыпуск билета организатором; escrow — передаёт продавец, выплата после концерта.
    SellStatus:
      type: string
      enum: [event_review, review, pending, listed, sold, rejected, cancelled]
      description: >
        event_review — концерта нет в каталоге, билет ждёт решения по EventRequest;
        после добавления концерта переходит в review (без организатора) или pending (с организатором).
        cancelled — продавец сам снял объявление до покупки.
    DisputeStatus:
      type: string
      enum: [open, refunded, rejected]
    DisputeAuthor:
      type: string
      enum: [buyer, seller, support]
    PayoutMethod:
      type: string
      enum: [sbp, card, account]
    PayoutStatus:
      type: string
      enum: [waiting, no_details, scheduled, sent, frozen, cancelled]
      description: >
        no_details — билет продан, но в профиле нет реквизитов: деньги ждут. Как только реквизиты
        указаны, выплата идёт по обычным правилам (organizer — сразу, escrow — после releaseAt).
    AggregatorStatus:
      type: string
      enum: [UP, DEGRADED, DOWN]
    AggregatorMode:
      type: string
      enum: [auto, force_on, force_off]
    Role:
      type: string
      enum: [customer, admin]

    Venue:
      type: object
      required: [name, city, address]
      properties:
        name: { type: string }
        city: { type: string }
        address: { type: string }

    EventRef:
      type: object
      required: [id, title, startsAt, venue]
      properties:
        id: { type: string }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        venue: { $ref: "#/components/schemas/Venue" }

    EventItem:
      type: object
      required:
        [id, title, artist, category, group, description, startsAt, venue, status,
         ageLimit, aggregatorId, organizerConnected, salesEnabled, minFaceValue,
         availableCount, waitlistCount, isFavorite, resaleForbidden, resaleNote]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        category: { type: string }
        group: { $ref: "#/components/schemas/EventGroup" }
        description: { type: string }
        startsAt: { type: string, format: date-time }
        venue: { $ref: "#/components/schemas/Venue" }
        status: { $ref: "#/components/schemas/EventStatus" }
        ageLimit: { type: integer }
        aggregatorId:
          type: [string, "null"]
          description: null — организатор не подключён.
        organizerConnected: { type: boolean }
        salesEnabled:
          type: boolean
          description: Считает бэкенд — статус API организатора плюс ручной режим из админки.
        minFaceValue:
          oneOf: [ { $ref: "#/components/schemas/Money" }, { type: "null" } ]
        availableCount: { type: integer }
        waitlistCount: { type: integer }
        isFavorite: { type: boolean, description: Для гостя всегда false. }
        resaleForbidden:
          type: boolean
          description: >
            Организатор запрещает перепродажу (выяснил админ по заявке). В каталоге (scope=catalog)
            такие концерты не отдаются; в scope=sell — отдаются, фронт показывает пометку и не даёт выбрать.
        resaleNote: { type: [string, "null"], description: Что именно запрещает организатор. }

    Seat:
      type: object
      required: [sector]
      properties:
        sector: { type: string }
        row: { type: string }
        place: { type: string }

    Offer:
      type: object
      required: [id, eventId, seat, faceValue, fee, currency, personalized, guarantee]
      properties:
        id: { type: string }
        eventId: { type: string }
        seat: { $ref: "#/components/schemas/Seat" }
        faceValue: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        currency: { type: string, enum: [RUB] }
        personalized: { type: boolean }
        guarantee: { $ref: "#/components/schemas/Guarantee" }

    Buyer:
      type: object
      required: [name, email, phone]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }

    Ticket:
      type: object
      required: [id, barcode, barcodeType, pdfUrl]
      properties:
        id: { type: string }
        barcode: { type: string }
        barcodeType: { type: string, enum: [QR, EAN-13, Code128] }
        pdfUrl: { type: [string, "null"] }

    Attachment:
      type: object
      required: [id, name, mime, size, url]
      properties:
        id: { type: string }
        name: { type: string }
        mime: { type: string }
        size: { type: integer }
        url:
          type: [string, "null"]
          description: Ссылка со сроком жизни; null, если файл не отдаётся.

    DisputeMessage:
      type: object
      required: [id, author, text, at, attachments]
      properties:
        id: { type: string }
        author: { $ref: "#/components/schemas/DisputeAuthor" }
        text: { type: string }
        at: { type: string, format: date-time }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }

    Dispute:
      type: object
      required: [status, openedAt, resolution, resolvedAt, messages]
      properties:
        status: { $ref: "#/components/schemas/DisputeStatus" }
        openedAt: { type: string, format: date-time }
        resolution: { type: [string, "null"], description: Комментарий поддержки к решению. }
        resolvedAt: { type: [string, "null"], format: date-time }
        messages: { type: array, items: { $ref: "#/components/schemas/DisputeMessage" } }

    Order:
      type: object
      required:
        [id, status, event, offer, total, createdAt, expiresAt, buyer, tickets,
         disputeUntil, escrow, dispute]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        event: { $ref: "#/components/schemas/EventRef" }
        offer: { $ref: "#/components/schemas/Offer" }
        total: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        buyer:
          oneOf: [ { $ref: "#/components/schemas/Buyer" }, { type: "null" } ]
        tickets: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
        disputeUntil:
          type: string
          format: date-time
          description: До какого момента можно открыть спор (сутки после начала концерта).
        escrow:
          type: [object, "null"]
          description: Только для guarantee=escrow — когда деньги уйдут продавцу.
          properties:
            releaseAt: { type: string, format: date-time }
        dispute:
          oneOf: [ { $ref: "#/components/schemas/Dispute" }, { type: "null" } ]

    DisputeView:
      type: object
      required: [order, dispute, viewer, canWrite]
      properties:
        order: { $ref: "#/components/schemas/Order" }
        dispute: { $ref: "#/components/schemas/Dispute" }
        viewer: { $ref: "#/components/schemas/DisputeAuthor" }
        canWrite: { type: boolean }

    PayoutMethodInfo:
      type: object
      description: Реквизиты выплаты из профиля — одни на все продажи пользователя.
      required: [method, details, updatedAt]
      properties:
        method: { $ref: "#/components/schemas/PayoutMethod" }
        details: { type: string, description: "Замаскированные реквизиты, например «карта •••• 4242»." }
        updatedAt: { type: string, format: date-time }

    Payout:
      type: object
      description: Выплата по конкретной продаже. Реквизиты — текущие из профиля (null, если не указаны).
      required: [method, details, status, at]
      properties:
        method:
          oneOf: [ { $ref: "#/components/schemas/PayoutMethod" }, { type: "null" } ]
        details:
          type: [string, "null"]
          description: Замаскированные реквизиты, например «карта •••• 4242».
        status: { $ref: "#/components/schemas/PayoutStatus" }
        at: { type: [string, "null"], format: date-time }

    SellRequest:
      type: object
      required:
        [id, event, seat, faceValue, orderNumber, status, guarantee, payout,
         disputeOrderId, disputeStatus, createdAt]
      properties:
        id: { type: string }
        event: { $ref: "#/components/schemas/EventRef" }
        seat: { $ref: "#/components/schemas/Seat" }
        faceValue: { $ref: "#/components/schemas/Money" }
        orderNumber: { type: string }
        status: { $ref: "#/components/schemas/SellStatus" }
        guarantee: { $ref: "#/components/schemas/Guarantee" }
        rejectReason: { type: string }
        payout: { $ref: "#/components/schemas/Payout" }
        disputeOrderId: { type: [string, "null"] }
        disputeStatus:
          oneOf: [ { $ref: "#/components/schemas/DisputeStatus" }, { type: "null" } ]
        createdAt: { type: string, format: date-time }

    AdminSellRequest:
      allOf:
        - $ref: "#/components/schemas/SellRequest"
        - type: object
          required: [sellerEmail, purchaseEmail, boughtAt, sourceUrl, ticketFileName, receiptFileName, eventIsNew, check, seller]
          properties:
            sellerEmail: { type: string }
            purchaseEmail: { type: string }
            boughtAt: { type: string }
            sourceUrl: { type: [string, "null"] }
            ticketFileName: { type: [string, "null"] }
            receiptFileName: { type: [string, "null"], description: "Чек покупки, если продавец приложил." }
            eventIsNew: { type: boolean }
            check: { $ref: "#/components/schemas/SellCheck" }
            seller: { $ref: "#/components/schemas/SellerHistory" }

    SellCheck:
      type: object
      description: Автоматическая оценка заявки до модератора.
      required: [score, suspicious, signals]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        suspicious: { type: boolean, description: "score < 40 — отдельный список «Подозрительные»" }
        signals:
          type: array
          items:
            type: object
            required: [ok, text]
            properties:
              ok: { type: boolean }
              text: { type: string, example: "Ссылка на билетный сервис: Кассир.ру" }

    SellerHistory:
      type: object
      required: [requests, approved, rejected, strikes, restrictedUntil]
      properties:
        requests: { type: integer }
        approved: { type: integer }
        rejected: { type: integer }
        strikes: { type: integer, description: Отказы со spam=true }
        restrictedUntil: { type: [string, "null"], format: date-time }

    EventRejectReason:
      type: string
      enum: [not_found, resale_forbidden, out_of_region, past, spam, other]

    EventRequest:
      type: object
      required: [id, status, title, city, venue, startsAt, sourceUrls, sellers, check, createdAt, eventId, rejectReason, comment, resolvedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, added, merged, rejected] }
        title: { type: string }
        city: { type: string }
        venue: { type: string }
        startsAt: { type: string, format: date-time }
        sourceUrls: { type: array, items: { type: string } }
        sellers:
          type: array
          items:
            type: object
            required: [sellRequestId, sellerEmail, createdAt, hasReceipt]
            properties:
              sellRequestId: { type: string }
              sellerEmail: { type: string }
              createdAt: { type: string, format: date-time }
              hasReceipt: { type: boolean, description: Продавец приложил чек покупки. }
        check:
          $ref: "#/components/schemas/SellCheck"
        createdAt: { type: string, format: date-time }
        eventId: { type: [string, "null"], description: "Итоговый концерт (added, merged, а при resale_forbidden — карточка с запретом)" }
        rejectReason:
          oneOf: [ { $ref: "#/components/schemas/EventRejectReason" }, { type: "null" } ]
        comment: { type: [string, "null"] }
        resolvedAt: { type: [string, "null"], format: date-time }

    EventCardInput:
      type: object
      required: [title, artist, group, description, city, venue, address, startsAt, ageLimit]
      properties:
        title: { type: string }
        artist: { type: string, description: Пусто — берётся title. }
        group: { $ref: "#/components/schemas/EventGroup" }
        description: { type: string }
        city: { type: string }
        venue: { type: string }
        address: { type: string }
        startsAt: { type: string, format: date-time }
        ageLimit: { type: integer, minimum: 0, maximum: 21 }

    AdminDispute:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [dispute, sellerEmail]
          properties:
            dispute: { $ref: "#/components/schemas/Dispute" }
            sellerEmail: { type: [string, "null"] }

    NewEventInput:
      type: object
      required: [title, city, venue, startsAt, sourceUrl]
      properties:
        title: { type: string }
        city: { type: string }
        venue: { type: string }
        startsAt: { type: string, format: date-time }
        sourceUrl: { type: string, format: uri, description: Ссылка на страницу концерта для проверки. }

    PayoutInput:
      description: Реквизиты выплаты. Номер карты в бэкенд не попадает — приходит токен.
      oneOf:
        - type: object
          required: [method, phone, bank]
          properties:
            method: { type: string, enum: [sbp] }
            phone: { type: string }
            bank: { type: string }
        - type: object
          required: [method, cardToken, cardLast4]
          properties:
            method: { type: string, enum: [card] }
            cardToken: { type: string }
            cardLast4: { type: string }
        - type: object
          required: [method, holder, bik, account]
          properties:
            method: { type: string, enum: [account] }
            holder: { type: string }
            bik: { type: string }
            account: { type: string }

    SellRequestInput:
      type: object
      description: >
        Тело поля data в multipart. Либо eventId из каталога, либо newEvent.
        Файл билета передаётся отдельным полем ticketFile.
      required: [orderNumber, purchaseEmail, boughtAt, seat, faceValue]
      properties:
        eventId: { type: string }
        newEvent: { $ref: "#/components/schemas/NewEventInput" }
        orderNumber: { type: string }
        purchaseEmail: { type: string, format: email }
        boughtAt:
          type: string
          description: >
            Где куплен билет: значение из списка фронта (Яндекс Афиша, Кассир.ру, Ticketland, Радарио,
            Intickets, Ticketscloud, Qtickets, Timepad, Касса площадки) или свободный текст для «Другое».
        seat: { $ref: "#/components/schemas/Seat" }
        faceValue: { $ref: "#/components/schemas/Money" }
      # Реквизиты выплаты в заявку не входят: они в профиле, PUT /users/me/payout-method.

    DisputeMessageForm:
      type: object
      required: [text]
      properties:
        text: { type: string }
        files:
          type: array
          items: { type: string, format: binary }
          description: До 5 файлов (image/pdf/video) по 20 МБ каждый.

    NotificationKind:
      type: string
      enum:
        [order_paid, order_issued, order_failed, order_expired, order_refunded,
         sell_listed, sell_rejected, sell_sold, sell_cancelled, sell_event_added, payout_sent,
         dispute_opened, dispute_message, dispute_resolved]

    AppNotification:
      type: object
      required: [id, kind, title, text, at, target, read]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        title: { type: string, example: Билет купили }
        text: { type: string, example: "Би-2, Танцпол: 4 500 ₽" }
        at: { type: string, format: date-time }
        target:
          type: object
          required: [type, id]
          description: >
            Куда ведёт клик. order — id заказа; dispute — id заказа со спором;
            sell — id заявки на продажу.
          properties:
            type: { type: string, enum: [order, dispute, sell] }
            id: { type: string }
        read: { type: boolean }

    NotificationFeed:
      type: object
      required: [items, unread]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AppNotification" }
        unread:
          type: integer
          description: Сколько непрочитанных — для точки на аватаре.

    WaitlistEntry:
      type: object
      required: [id, event, position, createdAt]
      properties:
        id: { type: string }
        event: { $ref: "#/components/schemas/EventRef" }
        position: { type: integer }
        createdAt: { type: string, format: date-time }

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        phone: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    OtpChallenge:
      type: object
      required: [challengeId, expiresAt, resendAvailableAt]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        resendAvailableAt: { type: string, format: date-time }

    TokenResponse:
      type: object
      required: [tokenType, accessToken, accessTokenExpiresAt]
      properties:
        tokenType: { type: string, example: Bearer }
        accessToken: { type: string, description: "JWT, 15 минут; ключ проверки — /.well-known/jwks.json identity" }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken:
          type: string
          description: Временно в теле; после перехода на httpOnly-куку поля не будет.
        refreshTokenExpiresAt: { type: string, format: date-time }

    RefreshBody:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, maxLength: 128 }

    Me:
      type: object
      required: [id, email, roles, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [CUSTOMER, SUPPORT, ADMIN] }
        status: { type: string, example: ACTIVE }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, "null"], format: date-time }

    Problem:
      type: object
      description: Ошибка identity (RFC 9457). detail — текст для человека.
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, example: Код неверный или истёк }
        code: { type: string, example: invalid_code }
        errors:
          type: object
          additionalProperties: { type: string }
          description: Только для validation_failed — поле → текст.

    HealthCheck:
      type: object
      required: [at, ok, latencyMs, code]
      properties:
        at: { type: string, format: date-time }
        ok: { type: boolean }
        latencyMs: { type: [integer, "null"] }
        code: { type: [integer, "null"] }

    Aggregator:
      type: object
      required: [id, name, kind, status, mode, lastCheckAt, latencyMs, eventsCount, checks]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        status: { $ref: "#/components/schemas/AggregatorStatus" }
        mode: { $ref: "#/components/schemas/AggregatorMode" }
        lastCheckAt: { type: string, format: date-time }
        latencyMs: { type: [integer, "null"] }
        eventsCount: { type: integer }
        checks: { type: array, items: { $ref: "#/components/schemas/HealthCheck" } }
