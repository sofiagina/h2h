# Прод: кладётся на сервер в /opt/h2h/docker-compose.yml, рядом с .env.
# nginx стоит на хосте (не в compose) и проксирует на 127.0.0.1:8080 — см. deploy/nginx.
#
#   cd /opt/h2h && docker compose up -d
#
# Обновление образа делает Gitea Actions (.gitea/workflows/release.yml).

services:
  app:
    image: git.tunele.ru/h2h/h2h-core:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT: http://minio:9000
    # Порт виден только с самого сервера: снаружи ходят через nginx.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Файлы: билеты и материалы споров. Перед продом зафиксировать тег вместо latest.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
