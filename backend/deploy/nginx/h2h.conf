# nginx для Hand2Hand: TLS, статика фронта, проксирование API.
# Файл кладётся в /etc/nginx/sites-available/h2h.conf и линкуется в sites-enabled.
# Зоны лимитов живут в http-контексте — они в h2h-limits.conf (ставится в /etc/nginx/conf.d/).
#
# Сертификат выпускается certbot:
#   certbot --nginx -d h2h.tunele.ru
# Он сам подставит пути к сертификатам и редирект с http.

server {
    listen 80;
    listen [::]:80;
    server_name h2h.tunele.ru;

    # До выпуска сертификата здесь должен отвечать certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name h2h.tunele.ru;

    # Эти строки обычно прописывает certbot.
    ssl_certificate     /etc/letsencrypt/live/h2h.tunele.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/h2h.tunele.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Платёжная форма открывается в отдельном окне, во фрейм наш сайт встраивать не нужно.
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # По умолчанию тела запросов маленькие; на загрузку файлов лимит поднят отдельно ниже.
    client_max_body_size 1m;

    # ------- Фронт: собранная статика из Front-AdminPanel (npm run build -> dist) -------
    root /var/www/h2h;
    index index.html;

    # Файлы с хэшем в имени не меняются — можно кэшировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Одностраничное приложение: все неизвестные пути отдаём index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------- API -------
    location /api/ {
        limit_req zone=h2h_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/h2h-proxy.conf;
    }

    # ------- Сервис identity (вход, токены, профиль) -------
    # У identity пути без префикса: /api/v1/auth/x → /auth/x, /api/v1/me → /me.
    # Лимит жёстче, чтобы коды не перебирали. Реальный IP клиента identity берёт
    # из X-Forwarded-For (server.forward-headers-strategy=native), иначе его
    # собственные лимиты по IP увидят только 127.0.0.1.
    location /api/v1/auth/ {
        limit_req zone=h2h_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081/auth/;
        include /etc/nginx/snippets/h2h-proxy.conf;
    }

    location ~ ^/api/v1/me(/.*)?$ {
        limit_req zone=h2h_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8081/me$1$is_args$args;
        include /etc/nginx/snippets/h2h-proxy.conf;
    }

    # Загрузка файлов: билет продавца, материалы спора (до 5 файлов по 20 МБ).
    location ~ ^/api/v1/(sell-requests|orders/[^/]+/dispute) {
        limit_req zone=h2h_api burst=20 nodelay;
        client_max_body_size 120m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/h2h-proxy.conf;
    }

    # ------- Вебхук платёжного сервиса -------
    # Общий лимит здесь не нужен: при пиках уведомления терять нельзя.
    # ВНИМАНИЕ: список IP ЮKassa взять из их актуальной документации и раскомментировать.
    # Пока список не внесён, единственная защита — проверка статуса платежа
    # запросом к провайдеру на стороне приложения (см. CLAUDE.md, §7).
    location = /api/v1/webhooks/yookassa {
        # allow <адрес или подсеть из документации ЮKassa>;
        # deny all;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/h2h-proxy.conf;
    }

    # Служебные эндпоинты наружу не отдаём.
    location /actuator/ {
        deny all;
    }
}
