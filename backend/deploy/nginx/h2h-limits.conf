# Зоны лимитов запросов. Работают только в http-контексте,
# поэтому файл кладётся в /etc/nginx/conf.d/h2h-limits.conf, а не в server-блок.

# Общий лимит на API: 20 запросов в секунду с адреса.
limit_req_zone $binary_remote_addr zone=h2h_api:10m rate=20r/s;

# Вход по одноразовому коду: 1 запрос в секунду, чтобы коды не перебирали.
limit_req_zone $binary_remote_addr zone=h2h_auth:10m rate=1r/s;

# Отказ по лимиту — 429, его фронт показывает как «слишком много запросов».
limit_req_status 429;
