# Локальная разработка: только инфраструктура.
# Само приложение запускается из IDE или через ./mvnw spring-boot:run — так быстрее пересобирать.
#
#   cp .env.example .env && docker compose up -d
#
# Mailpit (письма с кодами входа): http://localhost:8025
# MinIO (файлы билетов и споров):  http://localhost:9001

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-h2h}
      POSTGRES_USER: ${DB_USER:-h2h}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-h2h}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-h2h} -d ${DB_NAME:-h2h}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-h2hminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-h2hminio123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # Локальная почта: письма никуда не уходят, их видно в веб-интерфейсе.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
  minio-data:
